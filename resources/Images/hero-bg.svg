    <circle cx="150" cy="30" r="0.8" opacity="0.7"/>
    <circle cx="220" cy="90" r="1.0" opacity="0.8"/>
    <circle cx="310" cy="45" r="0.6" opacity="0.6"/>
    <circle cx="380" cy="20" r="1.1" opacity="0.85"/>
    <circle cx="460" cy="70" r="0.7" opacity="0.65"/>
    <circle cx="540" cy="35" r="1.3" opacity="0.9"/>
    <circle cx="600" cy="85" r="0.6" opacity="0.5"/>
    <circle cx="670" cy="15" r="0.9" opacity="0.75"/>
    <circle cx="760" cy="55" r="1.0" opacity="0.8"/>
    <circle cx="840" cy="25" r="0.7" opacity="0.6"/>
    <circle cx="920" cy="75" r="1.2" opacity="0.88"/>
    <circle cx="1000" cy="40" r="0.8" opacity="0.7"/>
    <circle cx="1080" cy="90" r="1.0" opacity="0.8"/>
    <circle cx="1150" cy="18" r="0.6" opacity="0.55"/>
    <circle cx="1230" cy="60" r="1.1" opacity="0.82"/>
    <circle cx="1310" cy="35" r="0.9" opacity="0.72"/>
    <circle cx="1390" cy="80" r="0.7" opacity="0.65"/>
    <circle cx="120" cy="140" r="0.6" opacity="0.5"/>
    <circle cx="270" cy="120" r="0.8" opacity="0.6"/>
    <circle cx="430" cy="160" r="0.6" opacity="0.45"/>
    <circle cx="700" cy="130" r="0.9" opacity="0.7"/>
    <circle cx="950" cy="110" r="0.7" opacity="0.6"/>
    <circle cx="1100" cy="155" r="0.6" opacity="0.5"/>
