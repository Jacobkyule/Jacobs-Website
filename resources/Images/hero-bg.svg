    <rect x="720" y="610" width="80" height="290"/>
    <rect x="795" y="650" width="35" height="250"/>
    <rect x="900" y="618" width="70" height="282"/>
    <rect x="965" y="640" width="45" height="260"/>
    <rect x="1070" y="612" width="85" height="288"/>
